<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supreme Student Council Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header / Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-graduation-cap text-3xl text-amber-400"></i>
        <div>
          <h1 class="font-bold text-lg text-emerald-400">Supreme Student Council</h1>
          <p class="text-xs text-slate-400">Official Portal & Directory</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="openModal('registerModal')" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-4 py-2 rounded-lg transition-all text-sm">
          <i class="fa-solid fa-user-plus mr-1"></i> Register
        </button>
        <button onclick="openModal('loginModal')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg transition-all text-sm">
          <i class="fa-solid fa-right-to-bracket mr-1"></i> Login
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Hero / Directory Tables -->
  <main class="max-w-6xl mx-auto p-4 space-y-8 my-auto w-full">
    <div class="text-center space-y-3 py-6">
      <h2 class="text-3xl font-extrabold text-amber-300">Welcome to the SSC Portal</h2>
      <p class="text-slate-400 max-w-xl mx-auto text-sm">Access council announcements, verify member status, and connect with your student leaders.</p>
    </div>

    <!-- Quick Actions / View Directory Buttons -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
      <button onclick="openModal('memberModal')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-5 rounded-xl text-left transition-all group shadow">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="font-bold text-emerald-400 text-base group-hover:text-emerald-300">View Members Directory</h3>
            <p class="text-xs text-slate-400 mt-1">Check verified student memberships and IDs.</p>
          </div>
          <i class="fa-solid fa-users text-2xl text-emerald-500"></i>
        </div>
      </button>

      <button onclick="openModal('officerModal')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-5 rounded-xl text-left transition-all group shadow">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="font-bold text-amber-400 text-base group-hover:text-amber-300">Council Officers</h3>
            <p class="text-xs text-slate-400 mt-1">View active officers and council representatives.</p>
          </div>
          <i class="fa-solid fa-user-tie text-2xl text-amber-500"></i>
        </div>
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
    &copy; 2026 Supreme Student Council. All rights reserved.
  </footer>

  <!-- ================= MODALS ================= -->

  <!-- 1. Login Modal -->
  <div id="loginModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="bg-slate-800 text-slate-100 rounded-xl max-w-sm w-full border border-slate-700 shadow-2xl overflow-hidden">
      <div class="bg-emerald-900 px-6 py-4 flex justify-between items-center border-b border-emerald-700">
        <h3 class="font-bold text-amber-300">SSC Portal Login</h3>
        <button onclick="closeModal('loginModal')" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>
      
      <form onsubmit="handleLogin(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Enter your SSC ID Number</label>
          <input type="text" id="loginSscNumber" required placeholder="e.g., SSC-2026-0001" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm focus:border-amber-400 focus:outline-none">
        </div>

        <div class="pt-2 flex justify-end gap-3">
          <button type="button" onclick="closeModal('loginModal')" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-2 rounded-lg transition-all text-sm">Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Registration Modal -->
  <div id="registerModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="bg-slate-800 text-slate-100 rounded-xl max-w-lg w-full border border-slate-700 shadow-2xl overflow-hidden">
      <div class="bg-amber-900 px-6 py-4 flex justify-between items-center border-b border-amber-700">
        <h3 class="font-bold text-amber-300">SSC Member Registration</h3>
        <button onclick="closeModal('registerModal')" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>
